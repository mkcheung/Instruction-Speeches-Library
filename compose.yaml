# Hand-written per MODERNIZATION_PLAN.md §21 — deliberately not `laravel/sail`.
# Four services for S0 (§21.4): app, web, postgres, seaweedfs.
#
# What this teaches (§21.4): services, the default network, name-based DNS
# (containers reach each other by service name, e.g. `postgres`, `seaweedfs`),
# published ports, and the first named volume.
#
# Rules followed here, each with a reason (§21.3, §21.5):
#   - Postgres data is a NAMED VOLUME, never a bind mount — bind-mounting the
#     data directory on macOS is explicitly called out as something to avoid.
#   - vendor/ and node_modules/ are also named volumes at build time (baked
#     into the image, not bind-mounted) — bind-mounting tens of thousands of
#     small files through Docker Desktop's VirtioFS is the most common reason
#     people conclude "Docker is slow on Mac."
#   - No migrations run from an entrypoint — see docker/php notes; migrations
#     are a separate one-shot `docker compose exec app php artisan migrate`.
#   - depends_on uses `condition: service_healthy`, not the bare form — a bare
#     depends_on only waits for the container to *start*, not to be *ready*,
#     and app would boot against a Postgres still initializing.
#   - The database port is NOT published to the host by default (§21.5) —
#     uncomment it only when you want a GUI client attached.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clamav:
        condition: service_healthy
    env_file:
      - api/.env
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default

  # STEP-03's "two containers from the same image with a different command"
  # (STEP-03-upload-and-watch.md) — the cleanest illustration of
  # image-versus-container there is: `queue-worker` is built from the exact
  # same `runtime` target as `app`, differing only in the command it runs.
  # STEP-04 (§9.2) splits the transcode queue OUT of this service into its
  # own `ffmpeg-worker` service below, because `--timeout` is a per-PROCESS
  # setting: the `default` queue here (mail, etc.) wants ~60s, transcode
  # wants ~3700s, and one `queue:work` process can't have both. This service
  # now only ever drains the short-timeout `default` queue —
  # `after_commit => true` (TranscodeSpeechAsset) still applies to jobs
  # dispatched from here, it's just that no transcode job is ever routed to
  # this queue/connection.
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    # STEP-14: `horizon --environment=local-default` replaces bare
    # `queue:work`, so Horizon's dashboard (gated to admin/super_admin,
    # HorizonServiceProvider) actually has a process to report queue depth
    # and failed jobs for — config/horizon.php's own comment explains why
    # this is a SEPARATE environment key per container rather than one
    # `local`/`production` key covering all three workers: Horizon runs
    # every supervisor in the given environment IN this container, and only
    # this container has none of ffmpeg-worker's/whisper-worker's binaries.
    command: php artisan horizon --environment=local-default
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # STEP-12-admin-portal.md: App\Jobs\ScanApplicationDocument runs on
      # this service's `default` queue and needs a live `clamd` socket —
      # see the `clamav` service's own comment for why its healthcheck is
      # genuinely load-bearing here (freshclam's signature-DB load), not a
      # decorative dependency.
      clamav:
        condition: service_healthy
    env_file:
      - api/.env
    networks:
      - default

  # §9.2's transcode worker, split out of `queue-worker` above: its own
  # process (so its own `--timeout`), its own queue/connection
  # (`redis-long`/`transcode` — config/queue.php, `retry_after => 3900`,
  # owned by another agent hardening App\Jobs\TranscodeSpeechAsset in
  # parallel with this file), and built from the `ffmpeg-worker` Dockerfile
  # stage so ffmpeg never has to be present in `app`/`web`.
  #
  # >>> Built from a distro (apk) package, per the GPL note on the
  # >>> `ffmpeg-worker` Dockerfile stage — THIS IMAGE MUST NEVER BE PUSHED
  # >>> TO A REGISTRY. Nothing in .github/workflows/*.yml pushes images
  # >>> today (confirmed by reading ci.yml/deploy.yml), so there's no
  # >>> existing guardrail to lean on — if a registry-push step is added
  # >>> later, it must explicitly skip this service/target.
  #
  # `--timeout=3700` sits between TranscodeSpeechAsset's own `$timeout=3600`
  # and `redis-long`'s `retry_after=>3900` — the ordering §9.2 requires so a
  # process kill and a queue-release can't race each other. `nice -n 19` is
  # the process-level throttle; `cpus`/`mem_limit` below are this compose
  # deploy's equivalent of §9.2's systemd `CPUQuota=150%`.
  #
  # STEP-14 landed the real systemd units this comment used to say didn't
  # exist: ../speechcoach-deploy-target/systemd/laravel-worker-transcode@.service
  # (CPUQuota=150%, Nice=19 — the exact §9.2 mechanism) and its sibling
  # laravel-worker-default@.service, installable on any real systemd host
  # (see that directory's README.md for why they can't be live-verified
  # inside the faux-server container itself, which is Alpine/musl with no
  # systemd). This `ffmpeg-worker` Compose service remains the dev/Compose
  # path — the two are parallel deploy targets for the same command, not a
  # Compose-vs-systemd contradiction. Concurrency 1 is just "run one
  # replica of this service" — no `deploy.replicas`, no second copy.
  #
  # `-threads 2` (an ffmpeg CLI flag, not a compose/Docker setting) belongs
  # in the actual `ffmpeg` invocation in FfmpegTranscoder.php, not here —
  # not added in this file.
  ffmpeg-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: ffmpeg-worker
    # STEP-14: `nice -n 19` moved out of this shell wrapper and into
    # config/horizon.php's `supervisor-transcode.nice` — Horizon applies it
    # per-supervisor via pcntl itself, so wrapping the command is redundant
    # (and would be WRONG here: it would only `nice` horizon's own master
    # process, not the worker children it forks, which is what actually
    # needs the lower priority against a runaway ffmpeg).
    command: php artisan horizon --environment=local-transcode
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - api/.env
    # Headroom, relative to `app`/`web` (which currently have NO limits at
    # all): a runaway/pathological ffmpeg encode must not be able to starve
    # the web tier's CPU or get OOM-killed alongside it. 1.5 CPUs and 2GiB
    # is generous for a single 1080p libx264 encode (well above what `-threads
    # 2` on the ffmpeg side will actually use) while still leaving the rest
    # of a typical dev/small-prod host (app, web, postgres, valkey,
    # seaweedfs, mailpit) room to run. Revisit alongside real hardware specs
    # at deploy time — these are dev-sane defaults, not a capacity plan.
    cpus: "1.5"
    mem_limit: "2g"
    networks:
      - default

  # STEP-09-captions.md / the frozen STEP-09 backend contract §6: the
  # caption/transcript pipeline's worker — its own process, own queue
  # (`redis-long`/`captions`, config/queue.php), own compose service, so a
  # multi-minute whisper.cpp run can NEVER sit behind (or in front of) a
  # transcode job on `ffmpeg-worker`'s queue (R11 — the whole reason this
  # is a separate service and not a third command on `ffmpeg-worker`).
  #
  # >>> Built from the `whisper-worker` Dockerfile stage, which also `apk
  # >>> add`s ffmpeg for audio extraction — THIS IMAGE MUST NEVER BE PUSHED
  # >>> TO A REGISTRY, same GPL-isolation reasoning as `ffmpeg-worker`
  # >>> above. whisper.cpp's OWN code is MIT, unaffected by this — see the
  # >>> Dockerfile stage's own comment.
  #
  # >>> MODEL WEIGHTS LICENSE (STEP-09.md §4's own warning): `faster-
  # >>> whisper`/`whisper.cpp` are MIT, but the GGUF/ggml MODEL FILE mounted
  # >>> from `whisper-models` below carries ITS OWN separate license terms
  # >>> (OpenAI's Whisper model weights are MIT-licensed as of the models
  # >>> this project pins — verify against whichever exact model file is
  # >>> downloaded before any commercial use, per STEP-09.md's explicit
  # >>> "check before any commercial use" instruction). This comment is the
  # >>> recorded license-boundary note the frozen contract §6 requires;
  # >>> there is no repo-root LICENSE/NOTICE file precedent to extend
  # >>> instead (confirmed by reading the repo root).
  #
  # `whisper-models` is a NAMED VOLUME, read-only here, matching the
  # `postgres-data`/`seaweedfs-data` convention — model weights are NEVER
  # baked into the image (STEP-09.md: "mount them as a volume rather than
  # baking them into the image", or every rebuild ships hundreds of MB).
  # Populating it (a one-time `docker compose run --rm whisper-worker sh -c
  # "wget -O /models/ggml-base.en.bin <pinned-digest-URL>"`-style step,
  # pinned by the model file's published digest, not just a filename) is a
  # manual one-time setup step, not automated by this compose file — no
  # init-container/entrypoint download script exists yet in this repo.
  #
  # `cpus`/`mem_limit` are set INDEPENDENTLY from `ffmpeg-worker`'s
  # (1.5/2g) per the frozen contract §6 ("inherit the same pattern, not the
  # same values") — whisper.cpp's CPU-bound inference on the heaviest
  # container in the stack (STEP-09.md) gets more headroom than a single
  # ffmpeg encode; these are dev-sane defaults pending real hardware
  # numbers, not a capacity plan.
  whisper-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: whisper-worker
    # STEP-14: same reasoning as `ffmpeg-worker`'s command above — `nice` is
    # now `config/horizon.php`'s `supervisor-captions.nice`, applied by
    # Horizon per-worker-process rather than wrapping its master process.
    command: php artisan horizon --environment=local-captions
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - api/.env
    # WHISPER_MODEL_NAME is what WhisperTranscriber writes verbatim into
    # every `speech_transcripts.model` (config/captions.php's `model_name`).
    # Without it set here the column fell back to the literal
    # `whisper.cpp-base.en`, which encodes NEITHER the pinned whisper.cpp
    # commit nor the weights digest — so bumping either left every
    # transcript claiming an identical model, exactly the silent-drift
    # docker/whisper/model.lock exists to prevent. Kept equal to that
    # file's `model_id` (engine short-commit + weight short-digest);
    # scripts/verify-whisper-model-lock.sh pins the lock against the
    # Dockerfile commit, and this line is what carries it into the running
    # worker. WHISPER_MODEL_LOCK matches the path the Dockerfile copies the
    # lock file to in this image (`/docker/whisper/model.lock`), since the
    # config default resolves relative to `api/` and does not exist here.
    environment:
      WHISPER_MODEL_NAME: "${WHISPER_MODEL_NAME:-wcpp-6266a9f9-a03779c8}"
      WHISPER_MODEL_LOCK: /docker/whisper/model.lock
    # RO on purpose (STEP-09 verification plan §6.1, item 5) — this service
    # must never be able to write into the model volume, only read the
    # file `whisper-model-init` (below) placed there. The model is never
    # baked into the image itself either; see the license-boundary comment
    # on this service above.
    volumes:
      - whisper-models:/models:ro
    cpus: "2.0"
    mem_limit: "4g"
    networks:
      - default

  # STEP-09 verification plan §6.1, item 4: the one-shot initializer that
  # populates `whisper-models` — the ONLY service in this compose file with
  # an RW mount onto that volume (`whisper-worker` above stays read-only).
  # Downloads to a temp filename inside the volume, verifies SHA-256 against
  # docker/whisper/model.lock, then atomically renames into place; a
  # checksum mismatch deletes the temp file and exits non-zero. A file
  # already at the destination that hashes correctly exits 0 without
  # re-downloading or touching its mtime (docker/whisper/init-model.sh
  # owns this logic in full).
  #
  # Not started by a bare `docker compose up` — it is gated behind the
  # `whisper-model-init` profile, so an ordinary dev-stack boot never tries
  # to fetch ~142 MiB from Hugging Face. Run it explicitly:
  #   docker compose --profile whisper-model-init run --rm whisper-model-init
  # It is safe/idempotent to run repeatedly; running it again after
  # `whisper-worker` is already up requires no restart of that service —
  # the file it reads is already on disk via the shared named volume.
  whisper-model-init:
    profiles: ["whisper-model-init"]
    build:
      context: .
      dockerfile: Dockerfile
      target: whisper-model-init
    environment:
      WHISPER_MODEL_DIR: /models
      WHISPER_MODEL_LOCK: /docker/whisper/model.lock
    volumes:
      - whisper-models:/models
    networks:
      - default

  # STEP-09 verification plan §6.2: "define a Compose service that selects
  # that target" — the `whisper-smoke` Dockerfile stage above, with real
  # dev Composer deps + `pdo_sqlite`, exists specifically so
  # `RealWhisperAdapterSmokeTest` can run `php artisan test` against the
  # actual compiled `whisper-cli` binary + a real mounted model file. Not
  # started by a bare `docker compose up` — gated behind its own profile,
  # same pattern as `whisper-model-init` above, so an ordinary dev-stack
  # boot never builds this dev-tooling image.
  #
  # Mounts `whisper-models` READ-ONLY, exactly like `whisper-worker` —
  # this is a diagnostic for the adapter/CLI seam, never a second writer
  # into that volume. `RUNS_WHISPER_SMOKE=1` is the gate
  # `RealWhisperAdapterSmokeTest` checks (`->skip()`) so plain
  # `./vendor/bin/pest` elsewhere never attempts to shell out to a real
  # whisper.cpp binary that isn't present.
  #
  # `WHISPER_SMOKE_ARTIFACT_DIR` is a bind mount (not a named volume) so
  # bounded diagnostics the test writes on failure survive after
  # `docker compose run --rm` exits and are inspectable on the host —
  # `scripts/whisper-smoke-stack.sh` (§6.4) is the intended caller and
  # manages this directory's lifecycle; running this service directly
  # creates `./artifacts/whisper-smoke` on the host if it doesn't exist.
  whisper-smoke:
    profiles: ["whisper-smoke"]
    build:
      context: .
      dockerfile: Dockerfile
      target: whisper-smoke
    # Same env_file every other service in this file uses — DB_HOST=
    # postgres/DB_DATABASE=speechcoach/AWS_* media credentials/REDIS_HOST=
    # valkey, all resolved by service name over whichever compose network
    # this file is applied under (dev, or scripts/whisper-smoke-stack.sh's
    # own project). Required for `queued`'s plain `php artisan migrate`/
    # `captions:whisper-smoke-*` invocations, which run OUTSIDE `php
    # artisan test`.
    #
    # `DB_CONNECTION`/`DB_DATABASE` in `environment:` below deliberately
    # override this env_file's `DB_CONNECTION=pgsql` back to sqlite —
    # verified DIRECTLY that phpunit.xml's own `<env name="DB_CONNECTION"
    # .../>` does NOT win this fight on its own: PHPUnit only applies an
    # `<env>` value when that variable isn't already set in the process
    # environment (no `force="true"` in this repo's phpunit.xml), and
    # `docker compose`'s env_file already sets a REAL process env var
    # before PHP ever starts. Without this override, `adapter`'s `php
    # artisan test` run genuinely tried to connect to this project's
    # Postgres instead of the isolated SQLite the test's own docblock
    # promises (caught by actually running it, not by reading either
    # config file). `queued`'s own invocations still win over this: a
    # `docker compose run -e DB_CONNECTION=pgsql ...` flag outranks both
    # this `environment:` block and env_file.
    env_file:
      - api/.env
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      RUNS_WHISPER_SMOKE: "1"
      WHISPER_MODEL_NAME: "${WHISPER_MODEL_NAME:-wcpp-6266a9f9-a03779c8}"
      WHISPER_MODEL_LOCK: /docker/whisper/model.lock
      WHISPER_SMOKE_ARTIFACT_DIR: /artifacts
    volumes:
      - whisper-models:/models:ro
      - ./artifacts/whisper-smoke:/artifacts
    networks:
      - default

  # STEP-09-VERIFICATION-PLAN.md §4.1/§7 P0 finding: "Although the command
  # is scheduled in routes/console.php, no Compose scheduler service runs
  # it" — `Schedule::command('media:reconcile')` was dead code without an
  # actual process invoking `schedule:run` on a timer. `schedule:work`
  # (Laravel 13's documented long-running dev/prod-container convention —
  # it internally sleeps until the next due minute and calls `schedule:run`
  # itself, so no separate cron/supervisor entry is needed) is that
  # process. Built from the same `runtime` target as `app`/`queue-worker`
  # (§9.2's own "same image, different command" convention) — this command
  # needs nothing ffmpeg/whisper-specific, only the app's own artisan
  # commands (media:reconcile today; anything else scheduled later).
  #
  # `restart: unless-stopped` matters here specifically because §4.1's
  # whole recovery story ("hard worker loss is eventually recovered by an
  # actually running scheduler") depends on this container itself staying
  # up — an unscheduled scheduler cannot recover anything.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      valkey:
        condition: service_healthy
    env_file:
      - api/.env
    networks:
      - default

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
      args:
        VITE_API_URL: "" # relative /api/... — same-origin through nginx's proxy, see Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      # 8000 is already claimed on this host by an unrelated project's
      # container (recipe-app-api-proxy) — 8080 avoids the collision.
      - "8080:80"
      # STEP-02-first-deploy.md: TLS for app./api.speechcoach.test.
      - "443:443"
    volumes:
      # mkcert output (see STEP-02-first-deploy.md) — generated on the host,
      # never baked into the image or committed (docker/certs/.gitignore).
      - ./docker/certs:/etc/nginx/certs:ro
    extra_hosts:
      # host.docker.internal works out of the box on Docker Desktop (macOS),
      # but this makes it explicit and also covers Linux, where the same
      # name needs this entry to resolve to the host gateway.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # `localhost` resolves to ::1 here too (see seaweedfs's healthcheck
      # comment above) — nginx only listens on IPv4 by default in this image.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-speechcoach}
      POSTGRES_USER: ${DB_USERNAME:-speechcoach}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-speechcoach}
    volumes:
      - postgres-data:/var/lib/postgresql/data # NAMED volume — never a bind mount (§21.3)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-speechcoach} -d ${DB_DATABASE:-speechcoach}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default
    ports:
      - "5433:5432"   # GUI client access (§21.5) — 5433 avoids colliding with a native host Postgres on 5432

  # §9.1: after this service is healthy on a fresh volume, run
  # `docker compose exec app php artisan media:configure-cors` once — the
  # browser's direct multipart PUTs (App\Services\MultipartUploadService)
  # need the bucket to expose `ETag` cross-origin, or completion fails
  # silently. See App\Console\Commands\ConfigureMediaCorsCommand.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333" # S3 API — published so a human can seed a test object by hand (S0's "place a file by hand" step)
    healthcheck:
      # `localhost` resolves to ::1 in this image and the S3 listener is
      # IPv4-only, so wget against `localhost` gets connection-refused even
      # when the server is healthy — use 127.0.0.1. A bare, unsigned request
      # to the S3 API correctly returns 403 (no SigV4 auth), which is itself
      # proof the server is up and answering; `nc -z` just confirms the port.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

  # §9.2: "Redis + Horizon (self-hosted Redis is free...)". Valkey is the
  # BSD-licensed drop-in replacement, wire-compatible with Redis and the
  # protocol Laravel's `redis` queue/cache driver already speaks — no
  # `predis`/config changes beyond pointing REDIS_HOST here.
  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - default

  # STEP-12-admin-portal.md / STEP-12-FROZEN-CONTRACT.md §7: the ClamAV
  # scanner — `clamd` (long-running daemon), not one-shot `clamscan`, so
  # App\Services\Scanning\ClamdScanner hits a warm, already-signature-
  # loaded socket repeatedly rather than reloading signatures per file.
  # "Only place the system accepts arbitrary binaries from unverified
  # users and hands them to an administrator" (STEP-12.md) is why the
  # scanner arrives here and not earlier.
  #
  # The FIRST service in this compose file whose OWN healthcheck is
  # actually load-bearing for a genuinely slow startup (freshclam's
  # signature-database load can take minutes on a cold volume) rather than
  # a fast liveness probe that basically always passes immediately —
  # every other `condition: service_healthy` in this file (18 prior uses,
  # confirmed by direct count) waits out a healthcheck that's essentially
  # instantaneous once the process is up. `clamav-signatures` is a NAMED
  # volume (not baked into the image, not a bind mount) so the signature
  # database survives container recreation without a full re-download —
  # same `postgres-data`/`seaweedfs-data` convention.
  clamav:
    build:
      context: .
      dockerfile: Dockerfile
      target: clamav
    volumes:
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      # `clamdcheck.sh` does NOT exist on Alpine's `clamav-daemon` package
      # (that script ships only with Debian/Ubuntu's build — confirmed by
      # directly building this image and searching it: `find / -iname
      # clamdcheck*` finds nothing). `clamdscan --ping 1` is the real
      # equivalent available here, confirmed to return `PONG`/exit 0 once
      # clamd has finished loading its signature database, matching how
      # ClamdScanner itself reaches the daemon over TCPSocket 3310
      # (docker/clamav/clamd.conf). A long start_period/retries budget is
      # the point of this service: freshclam's signature load, not a bug,
      # is why this is generous where every other healthcheck in this
      # file is not.
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - default

  # S1's "container that exists purely to intercept something"
  # (STEP-01-identity.md): captures every outgoing mail instead of sending
  # it anywhere real, so the verification email can be read from the web UI
  # at http://localhost:8025. MAIL_HOST=mailpit (api/.env) resolves it over
  # this compose network with no further config — the whole point of the
  # exercise.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - default

  # ---------------------------------------------------------------------
  # STEP-14-deploy-hardening.md: "Containers introduced: glitchtip,
  # uptime-kuma. Teaches: Compose profiles, so the observability stack
  # does not run on your laptop by default."
  #
  # ALL FOUR services below (glitchtip-db-init, glitchtip-migrate,
  # glitchtip, glitchtip-worker) plus `uptime-kuma` further down carry
  # `profiles: ["observability"]`. A bare `docker compose up -d` — the
  # command used throughout every other STEP in this repo — does NOT
  # start anything in this block: Compose only starts a service whose
  # `profiles:` list intersects the active profile set, and the active
  # set is empty unless a human opts in with `--profile observability`
  # or `COMPOSE_PROFILES=observability` (confirmed against this
  # project's actual Compose v5.3.1 — `docker compose config -q` and
  # `docker compose --profile observability config -q` both verified
  # below, and `docker compose up -d` with no flag was confirmed NOT to
  # list these services in its plan). Bring the stack up explicitly:
  #   docker compose --profile observability up -d
  #
  # ⚠️ To stop JUST these services, do NOT use `docker compose
  # --profile observability down` — confirmed twice, live, that it tears
  # down the ENTIRE project (postgres, seaweedfs, everything), not only
  # the profiled services: `down` resolves and removes the whole compose
  # project regardless of which profile flag accompanies it, `--profile`
  # only affects which services `up` is willing to START. These are the
  # commands that really are scoped:
  #   docker compose --profile observability stop glitchtip glitchtip-worker uptime-kuma
  #   docker compose --profile observability rm -f glitchtip glitchtip-worker uptime-kuma
  # ---------------------------------------------------------------------

  # GlitchTip needs its OWN Postgres database, not `speechcoach` — same
  # "its own database" rule ../speechcoach-deploy-target/bin/provision.sh
  # applies to the staging/prod deploy DB (a migration against one
  # logical app must never be able to touch another's tables). The
  # `postgres:17-alpine` image this repo already pulls for the `postgres`
  # service above ships `createdb`, so this one-shot service reuses that
  # same image purely as an S3-free psql client against the already-
  # running `postgres` service — no new image, no second Postgres
  # instance. `|| true` makes a second run against an already-provisioned
  # volume a safe no-op (createdb's own error on an existing database is
  # otherwise non-zero), matching provision.sh's identical idempotency
  # guard. Not a long-running service — no `restart:` key, same
  # no-restart-policy convention `whisper-model-init` below documents as
  # "the one-shot pattern" in this file.
  glitchtip-db-init:
    profiles: ["observability"]
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-speechcoach}
    entrypoint: ["sh", "-c"]
    command:
      - createdb -h postgres -U ${DB_USERNAME:-speechcoach} glitchtip || true
    networks:
      - default

  # §21.5's migrations rule applies here exactly as it does to the app
  # itself: "Migrations must not run from a container entrypoint. With
  # one container it works; with two they race." `glitchtip`/
  # `glitchtip-worker` below both start from the same image and would
  # race a migration baked into either one's entrypoint — so, like this
  # file's own `app` container, migrations are a separate one-shot step
  # that must complete before the web/worker containers are allowed to
  # start. `condition: service_completed_successfully` (not
  # `service_healthy` — this container has no healthcheck, it exits) is
  # what actually enforces the ordering; `restart:` is deliberately
  # omitted, the same one-shot convention as `glitchtip-db-init` above
  # and `whisper-model-init` below.
  #
  # `bin/run-migrate.sh` (confirmed by reading it inside the pulled
  # `glitchtip/glitchtip:latest` image) runs `manage.py migrate`,
  # `createcachetable`, and `maintain_partitions` — GlitchTip's own
  # documented one-shot migration entrypoint, not a hand-rolled
  # alternative.
  glitchtip-migrate:
    profiles: ["observability"]
    image: glitchtip/glitchtip:latest
    command: ["bin/run-migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      glitchtip-db-init:
        condition: service_completed_successfully
    environment: &glitchtip-env
      # Dev-only literal, not a real secret, in the same spirit as this
      # file's `DB_PASSWORD=speechcoach`/`AWS_SECRET_ACCESS_KEY=
      # speechcoach-dev-secret` defaults — GlitchTip refuses to leave
      # `DEBUG=True` with this still at its OWN placeholder ("change_me")
      # but is otherwise happy running dev with a fixed, visible value.
      # The `${...:-default}` form lets a real deploy override it (e.g.
      # via a shell export or a root `.env` Compose file, neither of
      # which this repo has today) without touching this file — but
      # note that `api/.env` is NOT such a source: it is only ever
      # injected INTO already-started containers via `env_file:`
      # (Laravel's own runtime config), never read by `docker compose`
      # itself for `${...}` substitution. See api/.env.example's
      # GLITCHTIP_* block for the informational mirror of these values
      # and that exact caveat.
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:-speechcoach-dev-glitchtip-secret-not-for-prod}"
      DEBUG: "false"
      # GlitchTip's own database — never `speechcoach` (see
      # `glitchtip-db-init` above). Shares this compose's Postgres
      # credentials because it shares the one `postgres` service, not
      # because the two apps share a schema.
      DATABASE_URL: "postgres://${DB_USERNAME:-speechcoach}:${DB_PASSWORD:-speechcoach}@postgres:5432/glitchtip"
      # Valkey db INDEX 1, not the default 0 — `api/.env`'s REDIS_HOST=
      # valkey (Laravel's queue/cache) already owns db 0 on this same
      # instance; a shared db index would let GlitchTip's cache keys and
      # Laravel's queue keys collide under the same keyspace.
      VALKEY_URL: "redis://valkey:6379/1"
      # Used in email bodies (digest links, invite links) and DSN
      # generation — the browser-reachable address of the `glitchtip`
      # service's published port below, not the in-network service name.
      GLITCHTIP_DOMAIN: "http://localhost:8010"
      # Routes GlitchTip's own async digest/notification email through
      # this repo's existing zero-cost mail intercept (see `mailpit`'s
      # own comment above) instead of attempting a real SMTP send —
      # consistent with api/.env's MAIL_HOST=mailpit for the Laravel
      # side. View delivered digest mail at http://localhost:8025.
      EMAIL_URL: "smtp://mailpit:1025"
      DEFAULT_FROM_EMAIL: "glitchtip@speechcoach.test"
      # Single-instance dev box, no reverse-proxy host allowlist to get
      # right — GlitchTip's own default (`["*"]`) is fine for a profiled,
      # localhost-only container that `web`/nginx never proxies to.
    networks:
      - default

  # The actual Sentry-wire-protocol-compatible ingest + UI server. Takes
  # `SENTRY_LARAVEL_DSN` (api/.env.example) as its client-facing address
  # once a project/DSN is created through this service's own onboarding —
  # that's application-level GlitchTip configuration, not something this
  # compose file can template, so it's a documented manual step, not
  # automated here.
  glitchtip:
    profiles: ["observability"]
    image: glitchtip/glitchtip:latest
    command: ["bin/run-web.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
    environment: *glitchtip-env
    ports:
      - "8010:8000" # 8000 itself is already claimed on this host (see `web`'s own port comment)
    healthcheck:
      # No `curl`/`wget` in this image (confirmed: `which curl wget`
      # exits non-zero inside it) — `python3` is present, and GlitchTip
      # ships its own liveness route at `/_health/` (confirmed by
      # reading glitchtip/urls.py in the pulled image).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default

  # Celery's async worker, the other half of "a Celery worker/beat process
  # for async email+digest processing" — GlitchTip 6.x merged beat INTO
  # the worker (confirmed by reading bin/run-beat.sh in the pulled image:
  # "This script is deprecated and no longer does anything"; the real
  # scheduler lives in `manage.py runworker --scheduler`, which
  # `bin/run-worker.sh` already invokes), so there is deliberately no
  # separate `glitchtip-beat` service here — a third container running a
  # script that is a documented no-op would just be dead weight.
  glitchtip-worker:
    profiles: ["observability"]
    image: glitchtip/glitchtip:latest
    command: ["bin/run-worker.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      glitchtip-migrate:
        condition: service_completed_successfully
    environment: *glitchtip-env
    networks:
      - default

  # STEP-14: "Uptime Kuma is paired with a free external check —
  # monitoring from the same box tells you nothing when the box dies."
  # Uptime Kuma itself is the ON-box half of that pair (the external
  # check is a separate free third-party service configured at deploy
  # time, outside this repo). Official image, SQLite-backed — `/app/data`
  # is a NAMED volume (not a bind mount), same `postgres-data`/
  # `seaweedfs-data` convention, so monitors survive a rebuild.
  #
  # No `healthcheck:` override here — the image ships its OWN (`CMD-SHELL
  # extra/healthcheck`, confirmed via `docker inspect`), so this is the
  # one service in this file that genuinely needs no healthcheck authored
  # here at all.
  uptime-kuma:
    profiles: ["observability"]
    image: louislam/uptime-kuma:1
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - default

networks:
  default:
    name: speechcoach-dev

volumes:
  postgres-data:
  seaweedfs-data:
  whisper-models:
  clamav-signatures:
  uptime-kuma-data:
