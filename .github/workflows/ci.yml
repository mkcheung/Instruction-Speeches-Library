name: CI

on:
  push:
  pull_request:
  workflow_call:      # WHY: required before `uses:` can call this file.
                      # A "reusable workflow" is a whole workflow file invoked
                      # as a JOB — different from an Action, which is a single
                      # STEP. Same `uses:` keyword, two different levels:
                      #   steps: - uses: actions/checkout@v7   <- an Action
                      #   jobs:  ci: {uses: ./…/ci.yml}        <- this
                      # Adding it has NO effect on the push/pull_request
                      # triggers above — triggers are independent. #

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          # gd + exif are new in S1 for App\Services\AvatarProcessor's
          # EXIF-stripping re-encode and the feature test that reads the
          # re-encoded file back with exif_read_data() — without them here
          # the whole suite fails on a runner that never had the Docker
          # image's Dockerfile changes applied to it (CI installs PHP
          # itself, it doesn't build/run the app image).
          extensions: gd, exif, pdo_sqlite

      - uses: actions/setup-node@v7
        with:
         node-version: '22'
         cache: npm
         cache-dependency-path: web/package-lock.json

      # setup-php has no built-in Composer cache (unlike setup-node's `cache: npm`
      # above) because PHP projects don't share npm's one-canonical-location
      # convention. WHY the lockfile hash as the key: it must change exactly
      # when dependencies change, not more often (defeats the cache) and not
      # less (silently runs stale dependencies forever).
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist

      - name: Prepare api/.env
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JS dependencies
        working-directory: web
        run: npm ci

      - name: Lint PHP
        working-directory: api
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        working-directory: api
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --memory-limit=1G

      - name: Test PHP (Pest)
        working-directory: api
        # phpunit.xml pins DB_CONNECTION=sqlite/:memory: for the suite, so no
        # Postgres service container is needed here — the Postgres-specific
        # behavior this step depends on (case/accent-insensitive username
        # collision) is enforced in application code (App\Support\Username),
        # not database collation, precisely so it works identically on
        # sqlite in CI and Postgres in every real environment (see
        # STEP-01-identity.md's "Watch for"). The one thing sqlite CANNOT
        # substitute for — real Postgres type-strictness catching a bad
        # query — was verified separately, live, against the docker compose
        # stack; see this step's PR description.
        run: ./vendor/bin/pest

      - name: Typecheck
        working-directory: web
        # `tsc --noEmit` against the root tsconfig.json is a silent no-op —
        # it's a solution file with no `include` (TS project-references
        # convention), so this would check nothing and still exit 0. Use
        # `tsc -b` (see STEP-00-RETROSPECTIVE.md).
        run: npx tsc -b

      - name: Lint JS
        working-directory: web
        run: npx eslint .

      - name: Test JS
        working-directory: web
        run: npx vitest run

  # CP-03's "tie it to something real" follow-on: the actual STEP-03 e2e
  # spec, run against the actual docker-compose stack — not a toy site.
  # Runs independently of `test` above (no `needs:`) so a slow/flaky e2e
  # run never blocks the fast unit-test signal.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # STEP-02-first-deploy.md's domain layout, reproduced on the runner:
      # two hostnames sharing a registrable domain, both resolving locally.
      - name: Add speechcoach.test hosts entries
        run: |
          echo "127.0.0.1 app.speechcoach.test" | sudo tee -a /etc/hosts
          echo "127.0.0.1 api.speechcoach.test" | sudo tee -a /etc/hosts

      # Not `mkcert -install`: that imports the local CA into the runner's
      # NSS/system trust stores, which is one more thing to get right
      # (certutil, browser-specific trust DBs) for a value playwright.config.ts
      # already gets around with `ignoreHTTPSErrors: true`. Generating the
      # leaf cert alone is enough — nginx just needs *a* cert to terminate
      # TLS with, real trust chain or not.
      - name: Install mkcert and generate TLS certs
        run: |
          curl -sSL -o /usr/local/bin/mkcert https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64
          chmod +x /usr/local/bin/mkcert
          mkcert -cert-file docker/certs/speechcoach.test.pem \
                 -key-file  docker/certs/speechcoach.test-key.pem \
                 app.speechcoach.test api.speechcoach.test

      # No `php artisan key:generate` here (unlike the `test` job) — that
      # needs vendor/ installed on the runner just for this one value, and
      # api/.env is only read by `docker compose` (env_file:) to populate
      # the app/queue-worker containers, which build their own vendor/
      # inside the image regardless. APP_KEY's only real requirement is
      # "32 random bytes, base64, prefixed" — openssl gets there directly.
      - name: Prepare api/.env
        working-directory: api
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env

      # web/.env.example still documents the OLDER same-origin :8080 proxy
      # (pre-STEP-02); the real local .env (gitignored, matching what these
      # specs assert against) points at the app./api. subdomain split —
      # reproduce that exact value here rather than the example file's.
      - name: Prepare web/.env
        working-directory: web
        run: |
          echo "VITE_API_URL=https://api.speechcoach.test" > .env
          echo "VITE_ENABLE_SPIKES=false" >> .env

      - name: Install JS dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      # `--wait` (Compose v2) blocks until every service with a healthcheck
      # reports healthy, and fails fast if one goes unhealthy instead of
      # letting a doomed run limp to the Playwright step before failing
      # there with a far less obvious error.
      # `queue-worker` deliberately excluded here: it runs `php artisan
      # queue:work` from the moment its container starts, and that touches
      # the `cache` table (CACHE_STORE=database) on its very first loop
      # iteration — before migrations have run, that table doesn't exist
      # yet and the container crashes immediately. `--wait` treats a
      # crashed container as a hard failure, so bringing queue-worker up
      # in the same breath as everything else races the schema. This
      # isn't CI-specific: it's a real ordering requirement (migrate
      # before anything that reads the schema starts), just one that
      # never surfaced locally because a human naturally runs migrate
      # before ever starting queue-worker by hand.
      - name: Start the docker compose stack (excluding queue-worker)
        run: docker compose up -d --build --wait --wait-timeout 300 postgres seaweedfs valkey mailpit app web

      - name: Run migrations
        run: docker compose exec -T app php artisan migrate --force

      # WHY this step exists: CP-05 added tests/auth.setup.ts and made every
      # browser project depend on the `setup` project, so EVERY Playwright
      # run now begins by logging in as E2ESeeder's fixture users
      # (member@e2e.test etc.). `migrate --force` creates the schema and
      # nothing else, and E2ESeeder is deliberately NOT in DatabaseSeeder's
      # chain — it is opt-in precisely because it mints real accounts with a
      # known password (see DatabaseSeeder's own comment). Without this
      # step those accounts simply do not exist in CI: all three logins fail
      # on bad credentials, the app never leaves /login, and auth.setup.ts
      # dies on `page.waitForURL(.../onboarding)` after 30s — identically on
      # every retry, which is what tells you it is missing data and not the
      # Vite stall that warmup.setup.ts exists to absorb.
      #
      # `--class=E2ESeeder` unqualified on purpose: Laravel's SeedCommand
      # prefixes `Database\Seeders\` when the value contains no backslash,
      # which sidesteps quoting a namespace through YAML *and* the shell.
      # E2ESeeder calls RoleSeeder itself, so roles are covered.
      - name: Seed E2E fixture data
        run: docker compose exec -T app php artisan db:seed --class=E2ESeeder --force

      - name: Start queue-worker
        run: docker compose up -d --build --wait --wait-timeout 60 queue-worker

      # Vite is deliberately NOT containerized (§21.2) — nginx's
      # app.speechcoach.test server block proxies to
      # host.docker.internal:5173, i.e. THIS runner, exactly like a local
      # dev machine. Backgrounded so later steps in this job can still run;
      # GitHub Actions keeps background processes alive for the rest of the
      # job, only the runner's teardown at job end kills them.
      - name: Start the Vite dev server
        working-directory: web
        run: nohup npm run dev > /tmp/vite.log 2>&1 &

      - name: Wait for app.speechcoach.test to answer
        run: |
          for i in $(seq 1 30); do
            if curl -skf https://app.speechcoach.test/ -o /dev/null; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "--- vite log ---"; cat /tmp/vite.log
          echo "--- web container log ---"; docker compose logs web --tail=50
          exit 1

      - name: Run Playwright (speech-create e2e)
        working-directory: web
        # R3 (PLAN-APP-HEADER.md): a new spec only runs in CI if it's
        # listed here — `testDir` alone isn't enough, this command names
        # files explicitly. `app-shell.spec.ts` covers the header/sidebar
        # shell and D5's anonymous-visitor-stays-on-/u/username regression,
        # and needs the same E2ESeeder fixture data as `speech-create.spec.ts`.
        # `essay-editor.spec.ts` (CP-08) drives the real TipTap editor and
        # needs that same fixture — specifically the `ready` speech_asset and
        # the explicitly-reset essay columns E2ESeeder now writes.
        run: npx playwright test tests/speech-create.spec.ts tests/app-shell.spec.ts tests/essay-editor.spec.ts --project=chromium

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200