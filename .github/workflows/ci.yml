name: CI

on:
  push:
  pull_request:
  workflow_call:      # WHY: required before `uses:` can call this file.
                      # A "reusable workflow" is a whole workflow file invoked
                      # as a JOB — different from an Action, which is a single
                      # STEP. Same `uses:` keyword, two different levels:
                      #   steps: - uses: actions/checkout@v7   <- an Action
                      #   jobs:  ci: {uses: ./…/ci.yml}        <- this
                      # Adding it has NO effect on the push/pull_request
                      # triggers above — triggers are independent. #

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          # gd + exif are new in S1 for App\Services\AvatarProcessor's
          # EXIF-stripping re-encode and the feature test that reads the
          # re-encoded file back with exif_read_data() — without them here
          # the whole suite fails on a runner that never had the Docker
          # image's Dockerfile changes applied to it (CI installs PHP
          # itself, it doesn't build/run the app image).
          extensions: gd, exif, pdo_sqlite

      - uses: actions/setup-node@v7
        with:
         node-version: '22'
         cache: npm
         cache-dependency-path: web/package-lock.json

      # setup-php has no built-in Composer cache (unlike setup-node's `cache: npm`
      # above) because PHP projects don't share npm's one-canonical-location
      # convention. WHY the lockfile hash as the key: it must change exactly
      # when dependencies change, not more often (defeats the cache) and not
      # less (silently runs stale dependencies forever).
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        working-directory: api
        run: composer install --no-interaction --prefer-dist

      - name: Prepare api/.env
        working-directory: api
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JS dependencies
        working-directory: web
        run: npm ci

      - name: Lint PHP
        working-directory: api
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        working-directory: api
        run: php -d memory_limit=1G vendor/bin/phpstan analyse --memory-limit=1G

      - name: Test PHP (Pest)
        working-directory: api
        # phpunit.xml pins DB_CONNECTION=sqlite/:memory: for the suite, so no
        # Postgres service container is needed here — the Postgres-specific
        # behavior this step depends on (case/accent-insensitive username
        # collision) is enforced in application code (App\Support\Username),
        # not database collation, precisely so it works identically on
        # sqlite in CI and Postgres in every real environment (see
        # STEP-01-identity.md's "Watch for"). The one thing sqlite CANNOT
        # substitute for — real Postgres type-strictness catching a bad
        # query — was verified separately, live, against the docker compose
        # stack; see this step's PR description.
        run: ./vendor/bin/pest

      - name: Typecheck
        working-directory: web
        # `tsc --noEmit` against the root tsconfig.json is a silent no-op —
        # it's a solution file with no `include` (TS project-references
        # convention), so this would check nothing and still exit 0. Use
        # `tsc -b` (see STEP-00-RETROSPECTIVE.md).
        run: npx tsc -b

      - name: Lint JS
        working-directory: web
        run: npx eslint .

      - name: Test JS
        working-directory: web
        run: npx vitest run

  # CP-03's "tie it to something real" follow-on: the actual STEP-03 e2e
  # spec, run against the actual docker-compose stack — not a toy site.
  # Runs independently of `test` above (no `needs:`) so a slow/flaky e2e
  # run never blocks the fast unit-test signal.
  #
  # STEP-09-VERIFICATION-PLAN.md §7 rewired this job to drive the built
  # `web/dist` bundle through scripts/e2e-stack.sh (§3.1) instead of the
  # host Vite dev server — the cold-Vite-transform stalls warmup.setup.ts
  # exists to absorb and the HTTPS->HTTP mixed-content gap the E2E media
  # proxy fixes are both known false-failure sources for the raw-Vite
  # setup this job used to use; the built-bundle path removes both.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # scripts/e2e-stack.sh's own `prepare` command checks for these three
      # hostnames but deliberately does not sudo on the caller's behalf
      # (see that script's own comment) — this is that privileged step, run
      # once, here. `media.speechcoach.test` (§3.1 point 3/4) is new
      # relative to this job's pre-STEP-09 two-hostname layout.
      - name: Add speechcoach.test hosts entries (app/api/media)
        run: |
          echo "127.0.0.1 app.speechcoach.test" | sudo tee -a /etc/hosts
          echo "127.0.0.1 api.speechcoach.test" | sudo tee -a /etc/hosts
          echo "127.0.0.1 media.speechcoach.test" | sudo tee -a /etc/hosts

      # Installed on PATH once, here — scripts/e2e-stack.sh's `prepare`
      # command requires `mkcert` to already be present (it deliberately
      # does not install tooling itself) and generates a SEPARATE cert
      # (docker/certs-e2e/, covering all three hostnames including
      # media.speechcoach.test) from the `test` job's/dev stack's own
      # docker/certs/. Not `mkcert -install`: that imports the local CA
      # into the runner's NSS/system trust stores, one more thing to get
      # right for a value playwright.config.ts already gets around with
      # `ignoreHTTPSErrors: true`.
      - name: Install mkcert
        run: |
          curl -sSL -o /usr/local/bin/mkcert https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64
          chmod +x /usr/local/bin/mkcert

      # No `php artisan key:generate` here (unlike the `test` job) — that
      # needs vendor/ installed on the runner just for this one value, and
      # api/.env is only read by `docker compose` (env_file:) to populate
      # the app/queue-worker/scheduler/etc. containers, which build their
      # own vendor/ inside the image regardless. APP_KEY's only real
      # requirement is "32 random bytes, base64, prefixed" — openssl gets
      # there directly.
      - name: Prepare api/.env
        working-directory: api
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env

      - name: Install JS dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      # §3.1: certs + /etc/hosts verification for all three E2E hostnames
      # (the hosts entries themselves were added, with sudo, above —
      # `prepare` only checks they exist).
      - name: e2e-stack prepare (certs)
        run: ./scripts/e2e-stack.sh prepare

      - name: docker compose config sanity (base + E2E override)
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.e2e.yaml config --quiet

      # §7 items 1-5 in one command: builds the production `web/dist`
      # bundle (baked at image-build time via compose.e2e.yaml's
      # VITE_API_URL build arg) and serves it through the E2E nginx
      # override, migrates, runs `media:initialize` (idempotent
      # bucket+CORS, replacing the old CORS-only manual prerequisite),
      # seeds E2ESeeder, starts the default queue worker, and explicitly
      # stops whisper-worker — see scripts/e2e-stack.sh's own `cmd_up` for
      # the exact ordering.
      - name: e2e-stack up --fresh
        run: ./scripts/e2e-stack.sh up --fresh

      # §3.3: the narrow caption fixture seeder, run explicitly AFTER
      # E2ESeeder (which e2e-stack.sh's `up` already ran) — not folded into
      # that script, per the plan's "do not make every existing... seeder
      # pay for media setup."
      - name: Seed E2E caption fixtures
        run: docker compose -p speechcoach-e2e -f compose.yaml -f compose.e2e.yaml exec -T app php artisan db:seed --class=E2ECaptionsSeeder --force

      - name: e2e-stack nginx-test
        run: ./scripts/e2e-stack.sh nginx-test

      - name: e2e-stack verify-signed-media
        run: ./scripts/e2e-stack.sh verify-signed-media

      # §4.2 item 4 / §7 item 8: the live Postgres generated `body_tsv`
      # column + its GIN index — sqlite (the Pest suite's driver) cannot
      # express either, so this is the only place either is ever checked
      # against a real Postgres catalog.
      - name: Verify Postgres caption/transcript search schema
        run: ./scripts/verify-postgres-caption-schema.sh

      # §7 item 6 / §4.2 item 3: "the temporal acceptance proof" — video
      # must reach `ready` while captions stay queued/`processing` with
      # only the transcode worker consuming its queue and the deterministic
      # `caption-test-worker` held stopped.
      #
      # GAP, flagged honestly rather than silently skipped: this script is
      # part of §3.1's `caption-test-worker`/Valkey-key test-control
      # machinery, which had not landed on this branch as of this workflow
      # being written (verified by `ls scripts/` — no such file). This step
      # is left in, not removed or made `continue-on-error`, so CI visibly
      # (and correctly) fails here until that script exists, rather than
      # silently reporting green on a check that never ran.
      - name: Verify caption/transcode worker isolation
        run: ./scripts/verify-caption-worker-isolation.sh

      # §7 item 7: forced re-derive overlap, concurrent enable/upload/
      # retry, and attempt A -> disable -> re-enable B, against real
      # PostgreSQL/Valkey with two normal workers plus controlled E2E
      # caption workers.
      #
      # Same GAP as the step above — this script depends on the same
      # not-yet-landed `caption-test-worker` control machinery.
      - name: Verify caption concurrency invariants
        run: ./scripts/verify-caption-concurrency.sh

      - name: Run Playwright (speech-create, app-shell, essay-editor, captions)
        working-directory: web
        # R3 (PLAN-APP-HEADER.md): a new spec only runs in CI if it's
        # listed here — `testDir` alone isn't enough, this command names
        # files explicitly. `app-shell.spec.ts` covers the header/sidebar
        # shell and D5's anonymous-visitor-stays-on-/u/username regression,
        # and needs the same E2ESeeder fixture data as `speech-create.spec.ts`.
        # `essay-editor.spec.ts` (CP-08) drives the real TipTap editor and
        # needs that same fixture. `captions.spec.ts` (§7 item 9, added
        # here) is Chromium-only/serial by its own file-level `test.skip`,
        # so listing it alongside the other three (which run on every
        # browser project) is safe — non-chromium projects skip it
        # themselves.
        #
        # E2E_POSTGRES_CONTAINER: STEP-09-VERIFICATION-PLAN.md §3.1's named
        # gap — speech-create/essay-editor/onboarding specs' own psql
        # cleanup hardcodes the dev stack's Compose-derived container name
        # (tests/fixtures.ts's POSTGRES_CONTAINER falls back to that name
        # when this is unset, for a bare local run against the dev stack).
        # This job runs against scripts/e2e-stack.sh's dedicated
        # `speechcoach-e2e` project instead, whose postgres container is
        # named accordingly.
        env:
          E2E_POSTGRES_CONTAINER: speechcoach-e2e-postgres-1
        run: npx playwright test tests/speech-create.spec.ts tests/app-shell.spec.ts tests/essay-editor.spec.ts tests/captions.spec.ts --project=chromium

      # §7's scheduler paragraph: proves the actually-running `scheduler`
      # compose service (not a direct `artisan media:reconcile` call) is
      # what recovers a stale caption attempt, under the APP_ENV=e2e
      # every-minute schedule. Runs after Playwright so a real caption
      # fixture row has been exercised already; the script's own re-seed of
      # E2ECaptionsSeeder at the end restores the processing fixture's
      # liveness clocks regardless of run order.
      - name: Verify caption recovery scheduler
        run: ./scripts/verify-caption-recovery-scheduler.sh

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

      # §7 item 10: "app/worker logs" — every service in the E2E project,
      # not just app, so a caption-pipeline failure (queue-worker,
      # ffmpeg-worker, whisper-worker, scheduler) is diagnosable from the
      # same artifact set as the Playwright report above.
      - name: Dump E2E stack container logs on failure
        if: failure()
        run: docker compose -p speechcoach-e2e -f compose.yaml -f compose.e2e.yaml logs --tail=200

      - name: Tear down the E2E stack
        if: always()
        run: ./scripts/e2e-stack.sh down