# STEP-09 E2E verification plan §3.1: "Serve the already-built SPA at
# `https://app.speechcoach.test`; do not proxy this hostname to host Vite."
#
# Overrides docker/nginx/default.conf ONLY inside the E2E override
# (compose.e2e.yaml mounts this file over /etc/nginx/conf.d/default.conf on
# the `web` service). The ordinary dev path (default.conf, proxying
# app.speechcoach.test to host.docker.internal:5173) is UNCHANGED — this
# file exists precisely because dev's Vite dev server is "deliberately
# never containerized" (Dockerfile's own comment) and is the known source
# of the multi-minute warmup stalls the plan's §3.1 calls out.
#
# Three vhosts, matching default.conf's app./api. shape plus one addition:
#   app.speechcoach.test   -> the built SPA (/usr/share/nginx/html, baked
#                              into this image by the `webbuild`/`nginx`
#                              Dockerfile stages) served statically. No
#                              backend proxy lives on this hostname at all
#                              in E2E: the SPA is built with
#                              VITE_API_URL=https://api.speechcoach.test
#                              (compose.e2e.yaml's build arg), so every API
#                              call is already an absolute cross-origin
#                              request straight to api.speechcoach.test —
#                              unlike the dev/prod same-origin relative-URL
#                              build, there is no GET/POST path-sharing
#                              trick to reproduce here.
#   api.speechcoach.test   -> identical to default.conf's api. block: the
#                              real PHP-FPM `app` service over fastcgi.
#   media.speechcoach.test -> NEW. An E2E-only TLS proxy in front of
#                              SeaweedFS's S3 API, added so Playwright can
#                              hit a real HTTPS-signed SeaweedFS URL instead
#                              of the dev-only HTTP localhost:8333 (mixed
#                              content under the HTTPS app — plan §2's
#                              "Current E2E video is deliberately fake"
#                              finding). `AWS_ENDPOINT_PUBLIC` is set to
#                              this HTTPS origin in compose.e2e.yaml, so
#                              MediaUrlSigner (api/app/Services/
#                              MediaUrlSigner.php) presigns SigV4 requests
#                              whose Host header is `media.speechcoach.test`
#                              — `$http_host` below forwards that EXACT
#                              value upstream, which is what makes the
#                              signature still verify on SeaweedFS's side
#                              (SigV4 covers whatever Host string both ends
#                              agree on, not a fixed name).
server {
    listen 443 ssl;
    server_name app.speechcoach.test;

    ssl_certificate     /etc/nginx/certs/speechcoach-e2e.pem;
    ssl_certificate_key /etc/nginx/certs/speechcoach-e2e-key.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Plain SPA fallback — no backend proxy on this hostname in E2E (see
    # file header). React Router owns every client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.speechcoach.test;

    ssl_certificate     /etc/nginx/certs/speechcoach-e2e.pem;
    ssl_certificate_key /etc/nginx/certs/speechcoach-e2e-key.pem;

    client_max_body_size 0; # uploads go straight to storage, never through here (§9.1)

    location / {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS on;
    }
}

server {
    listen 443 ssl;
    server_name media.speechcoach.test;

    ssl_certificate     /etc/nginx/certs/speechcoach-e2e.pem;
    ssl_certificate_key /etc/nginx/certs/speechcoach-e2e-key.pem;

    # SigV4-signed GETs and multipart-upload PUTs alike can carry
    # substantial bodies/durations; do not let nginx's own limits
    # interfere with what the plan's §3.1 acceptance (a presigned GET
    # returning the committed MP4, a byte-range request returning 206)
    # requires from the real SeaweedFS S3 gateway itself.
    client_max_body_size 0;

    location / {
        # Deliberately NO path/URI suffix after the upstream address (per
        # plan §3.1 point 3): nginx then forwards the client's original
        # request URI — including the entire SigV4 query string — to
        # SeaweedFS completely unmodified. Appending anything here (even a
        # bare `/`) changes nginx's URI-rewriting behavior and would break
        # every presigned URL's signature.
        proxy_pass http://seaweedfs:8333;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;

        # SeaweedFS's S3 gateway answers Range requests with real 206
        # Partial Content responses (video.js seeking depends on this);
        # nginx forwards the client's Range header and passes the
        # upstream status/headers straight through by default — nothing
        # here strips or rewrites Range, Content-Range, Accept-Ranges,
        # Content-Length, Content-Type, or ETag.
        proxy_read_timeout 300s;
    }
}

# Plain HTTP/static health endpoint (no TLS) — keeps the existing
# container healthcheck (compose.yaml's `web` service: `wget -qO-
# http://127.0.0.1/`) valid without needing a certificate at all, same
# shape as default.conf's port-80 server.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
