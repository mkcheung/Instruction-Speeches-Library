# Serves the built SPA at `/` and reverse-proxies the Laravel API at `/api`
# (and Laravel's own `/up` healthcheck) to the `app` service's php-fpm socket
# over fastcgi. SCRIPT_FILENAME is a hardcoded string because it names a path
# on the `app` container's filesystem, not nginx's — nginx never touches the
# PHP source, it only forwards the FastCGI request. See MODERNIZATION_PLAN.md
# §9.3: this is also where the `X-Accel-Redirect` media-delivery fallback
# would live if presigned URLs ever needed sub-TTL revocation.
#
# S1 (STEP-01-identity.md) added everything from here down. Fortify's auth
# routes (register/login/logout/forgot-password/reset-password/email
# verification) and Sanctum's CSRF-cookie route are root-mounted, not under
# `/api`, to match the frontend's web/src/lib/api.ts + authApi.ts (built
# concurrently with this file) — config/fortify.php's `prefix` comment
# explains that choice on the backend side.
#
# The complication that creates: React Router ALSO owns client-side pages
# at some of these exact paths (`/login`, `/register`, `/forgot-password` —
# see web/src/App.tsx) so a browser can load/refresh them directly. The
# same path must resolve two different ways depending on METHOD: a GET is
# a page load (serve the SPA's index.html, let React Router render it) and
# a POST is the actual form submission (proxy to php-fpm). Getting this
# wrong 404s a direct load/refresh of /login — found only by actually
# requesting these paths through this nginx container both ways, not by
# reading config in isolation.
#
# nginx's `if` directive cannot safely contain `fastcgi_pass` (and friends)
# — nginx itself refuses to start with "fastcgi_index directive is not
# allowed here" if you try, caught only by actually starting the container,
# not by `nginx -t`-style config review alone done mentally. The standard
# safe idiom instead: `if` may only `return` a sentinel status code, and
# `error_page ... = @named_location` maps that sentinel to a real location
# block (fastcgi_pass and all) OUTSIDE any `if` context.
error_page 418 = @backend;

# Required for the Upgrade/Connection pair below: an empty Upgrade header
# (i.e. every non-websocket request) must map to Connection: close, not
# "upgrade" literally, or nginx tries to upgrade requests that never asked
# for it. This is the standard nginx websocket-proxying idiom.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# STEP-02-first-deploy.md: proves the production cookie-domain layout on
# two hostnames sharing the registrable domain `speechcoach.test`, over
# real (mkcert-issued) TLS. nginx is the one thing that terminates TLS for
# both — everything downstream of this file still speaks plain HTTP/fastcgi,
# same as the port-80 server below.
#
#   app.speechcoach.test -> the host's Vite dev server (§21.2: Vite is
#     deliberately never containerized, so this container reaches it via
#     Docker Desktop's host.docker.internal, not a compose service name).
#   api.speechcoach.test -> this container's own php-fpm backend (`app`
#     service), unconditionally — unlike the port-80 server, there's no SPA
#     sharing these paths on this hostname, so no GET/POST disambiguation
#     trick is needed.
#
# Certs are mkcert output, bind-mounted read-only from docker/certs/ (see
# compose.yaml) — never baked into the image or committed.
server {
    listen 443 ssl;
    server_name app.speechcoach.test;

    ssl_certificate     /etc/nginx/certs/speechcoach.test.pem;
    ssl_certificate_key /etc/nginx/certs/speechcoach.test-key.pem;

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Vite's HMR client reconnects over a websocket — without the
        # Upgrade/Connection pair nginx proxies it as a plain HTTP request
        # and HMR silently falls back to full page reloads.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name api.speechcoach.test;

    ssl_certificate     /etc/nginx/certs/speechcoach.test.pem;
    ssl_certificate_key /etc/nginx/certs/speechcoach.test-key.pem;

    client_max_body_size 0; # uploads go straight to storage, never through here (§9.1)

    location / {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        # Unlike the port-80 server's `HTTPS off`: this hostname's traffic
        # really is TLS up to this point, and Laravel's own URL generation
        # (verification email links via APP_URL) must know that.
        fastcgi_param HTTPS on;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0; # uploads go straight to storage, never through here (§9.1)

    location /up {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Paths only Fortify/Sanctum ever answer at — no SPA page shares the
    # exact path, so every method proxies straight through:
    #   - /api/*                          the JSON API proper
    #   - /sanctum/csrf-cookie            Sanctum's CSRF bootstrap (GET)
    #   - /logout                         POST only, no SPA page there
    #   - /reset-password (exact, no /:token) POST only — the SPA's GET
    #     page for this flow is /reset-password/{token}, a DIFFERENT path,
    #     handled by the catch-all below
    #   - /email/verify/...               the emailed link itself (GET,
    #     `auth`-guarded — see routes/web.php's `login` named route)
    #   - /email/verification-notification  "resend" (POST)
    location ~ ^/(api(/|$)|sanctum/csrf-cookie$|logout$|reset-password$|email/verify/|email/verification-notification$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS off;
    }

    # Paths BOTH a backend route AND a same-path SPA page claim: a POST is
    # the real form submission and OPTIONS is the browser's CORS preflight
    # for that POST (routed to @backend via the error_page trick above, so
    # Laravel's own CORS middleware — config/cors.php already lists these
    # paths — answers it); anything else (GET, page load/refresh) falls
    # through to the SPA. Without the OPTIONS case, nginx's static module
    # 405s the preflight itself (it only allows GET/HEAD on a real file
    # like index.html), so the browser never sends the real POST at all.
    location ~ ^/(register|login|forgot-password)$ {
        if ($request_method ~ ^(POST|OPTIONS)$) {
            return 418;
        }

        try_files $uri @spa;
    }

    location @backend {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param HTTPS off;
    }

    location @spa {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
