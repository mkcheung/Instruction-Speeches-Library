; PHP-FPM ships pm.max_children = 5 by default, which is the number of
; requests this container can serve AT ONCE — everything past five queues.
;
; Five is too few for two reasons:
;
; 1. §4/§10.5 and the project's own constraint list treat "multiple
;    simultaneous users" as a requirement, not an aspiration. One user
;    loading the watch page already fires several concurrent API calls
;    (session, profile, speech, reviews, annotations), so five workers is
;    roughly one-and-a-bit concurrent users, not five.
;
; 2. It made the Playwright suite time out rather than fail: with the
;    default 5 parallel workers, the browser contexts exhausted the pool
;    and page loads queued past the 30s test timeout. That reads as a
;    flaky test, but the test was right and the pool was the bottleneck.
;
; 16 is sized for a development machine (roughly 50MB/worker, so ~800MB
; worst case), not for production — the real host sizing exercise belongs
; with STEP-14's deploy hardening.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycle workers periodically so a slow leak in a long-running dev
; container doesn't accumulate across a day of work.
pm.max_requests = 500
