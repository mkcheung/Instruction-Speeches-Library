# STEP-12-admin-portal.md: minimal clamd config for the `clamav` compose
# service. TCPSocket (not the default unix socket) so
# App\Services\Scanning\ClamdScanner (running inside the `app`/
# `queue-worker` containers) can reach it by service name over the compose
# network, matching every other backing service in this repo (postgres,
# valkey, seaweedfs — all reached by TCP over the `default` network, never
# a shared unix socket / bind mount).
LogFile /var/log/clamav/clamd.log
LogTime yes
PidFile /run/clamav/clamd.pid
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /run/clamav/clamd.sock
User clamav
Foreground yes

# Matches App\Services\PdfUploadValidator::MAX_BYTES (10MB) with headroom
# — clamd's own stream size cap, independent of the application-level
# check that already runs before a file ever reaches ClamdScanner.
StreamMaxLength 20M
MaxThreads 4
